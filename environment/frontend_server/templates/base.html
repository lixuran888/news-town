<!DOCTYPE html>
{% load staticfiles %}
<html lang="en">
<head>
	<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reverie</title>
  <!-- Latest compiled and minified CSS -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css" integrity="sha384-HSMxcRTRxnN+Bdg0JdbxYKrThecOKuH5zCYotlSAcp1+c8xmyTe9GYg1l9a69psu" crossorigin="anonymous">
	<!-- Optional theme -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap-theme.min.css" integrity="sha384-6pzBo3FDv/PJ8r2KRkGHifhEocL+1X2rVCTTkUfGk7/0pbek5mMa1upzvWbrUbOZ" crossorigin="anonymous">
	<!-- Fallback for CDN failure -->
	<script>
		// 检查Bootstrap CSS是否加载成功
		window.addEventListener('load', function() {
			var testEl = document.createElement('div');
			testEl.className = 'hidden';
			document.body.appendChild(testEl);
			var isBootstrapLoaded = window.getComputedStyle(testEl).display === 'none';
			if (!isBootstrapLoaded) {
				console.warn('Bootstrap CSS可能未正确加载');
			}
			document.body.removeChild(testEl);
		});
	</script>
	<link rel="icon" type="image/png" href="{% static 'img/atlas.png' %}">

  <!-- 全局样式（包含游戏容器和日夜滤镜） -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  
  <!-- 基础样式重置，确保布局正常 -->
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }
  </style>

</head>
 
<body class="top-navigation" style="background: #E8D5B7; background-attachment: fixed; min-height: 100vh;">
  {% block content %}
	{% endblock content %}

	<!-- jQuery must be loaded before Bootstrap's JavaScript -->
	<script src="https://code.jquery.com/jquery-latest.min.js" type="text/javascript"></script>
	<script>
		// jQuery fallback
		if (typeof jQuery === 'undefined') {
			document.write('<script src="{% static 'js/jquery.min.js' %}"><\/script>');
		}
	</script>
	<!-- Latest compiled and minified JavaScript -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js" integrity="sha384-aJ21OjlMXNL5UyIl/XNwTMqvzeRMZH2w8c5cRVpzpU8Y5bApTppSuUkhZXN0VxHd" crossorigin="anonymous"></script>
	<script>
		// Bootstrap fallback
		if (typeof bootstrap === 'undefined' && typeof $.fn.modal === 'undefined') {
			document.write('<script src="{% static 'js/bootstrap.min.js' %}"><\/script>');
		}
	</script>

	{% block js_content %}
	{% endblock js_content %}

	<script type="text/javascript" id="clustrmaps" src="//clustrmaps.com/map_v2.js?d=Xha1v8a6ENHDAgZ2dJoH85LCl6H1VwpYfgwfbgau8r4&cl=ffffff&w=a"></script>
	<style type="text/css">
		#clustrmaps-widget-v2 {
			display: none !important
		}
	</style>
</body>
</html>
