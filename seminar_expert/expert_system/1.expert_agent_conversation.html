<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>专家 Agent 发言演示</title>
    <style>
      * {
        box-sizing: border-box;
        font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #0f172a, #1e293b 55%, #0f172a);
        color: #e2e8f0;
        font-size: 16px;
      }

      .overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      .board-wrapper {
        position: absolute;
        top: 50%;
        right: 48px;
        transform: translateY(-50%);
        pointer-events: auto;
        cursor: grab;
      }

      .board-wrapper.dragging {
        cursor: grabbing;
      }

      .board {
        width: 420px;
        max-width: calc(100vw - 32px);
        background: rgba(15, 23, 42, 0.92);
        border-radius: 32px;
        border: 1px solid rgba(147, 197, 253, 0.35);
        box-shadow: 0 35px 80px rgba(2, 6, 23, 0.65);
        padding: 32px 24px 28px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .board-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        user-select: none;
        cursor: grab;
      }

      .board-header:active {
        cursor: grabbing;
      }

      .board-title {
        font-size: 1.2rem;
        font-weight: 600;
        letter-spacing: 0.06em;
      }

      .board-subtitle {
        display: block;
        font-size: 0.92rem;
        color: rgba(226, 232, 240, 0.7);
        margin-top: 4px;
      }

      .board-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .board-round {
        font-size: 0.9rem;
        color: rgba(226, 232, 240, 0.7);
      }

      .board-exit {
        border: none;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: rgba(239, 68, 68, 0.18);
        color: #fecaca;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      .board-exit:hover {
        background: rgba(239, 68, 68, 0.32);
      }

      .stage {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 1.3rem;
        max-height: 70vh;
        overflow-y: auto;
        padding-right: 8px;
        scrollbar-width: thin;
        scrollbar-color: rgba(148, 163, 184, 0.4) transparent;
      }

      .stage::-webkit-scrollbar {
        width: 6px;
      }

      .stage::-webkit-scrollbar-track {
        background: transparent;
      }

      .stage::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.45);
        border-radius: 999px;
      }

      .modal {
        width: 320px;
        height: 420px;
        border-radius: 16px;
        background: rgba(15, 23, 42, 0.85);
        box-shadow: 0 25px 60px rgba(15, 23, 42, 0.5);
        border: 1px solid rgba(147, 197, 253, 0.35);
        display: none;
        flex-direction: column;
        position: relative;
        backdrop-filter: blur(10px);
      }
      .modal.agent-1 {
        background: rgba(15, 23, 42, 0.92);
        border-color: rgba(96, 165, 250, 0.55);
        box-shadow: 0 25px 60px rgba(59, 130, 246, 0.35);
      }

      .modal.agent-2 {
        background: rgba(17, 24, 39, 0.9);
        border-color: rgba(248, 250, 252, 0.35);
        box-shadow: 0 25px 60px rgba(248, 250, 252, 0.25);
      }

      .modal.host-agent {
        background: rgba(15, 23, 42, 0.88);
        border-color: rgba(190, 242, 100, 0.6);
        box-shadow: 0 25px 70px rgba(190, 242, 100, 0.25);
      }

      .modal.focus-ring {
        box-shadow: 0 30px 80px rgba(190, 242, 100, 0.5),
          0 0 0 2px rgba(190, 242, 100, 0.65);
      }

      .modal.agent-3 {
        background: rgba(20, 29, 48, 0.92);
        border-color: rgba(248, 113, 113, 0.45);
        box-shadow: 0 25px 60px rgba(248, 113, 113, 0.28);
      }

      .modal-header::after {
        content: "";
        position: absolute;
        left: 20px;
        right: 20px;
        bottom: -1px;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(148, 163, 184, 0.4),
          transparent
        );
      }

      .modal.active {
        display: flex;
        animation: fadeIn 0.4s ease forwards;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .modal-header {
        padding: 18px 20px 12px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.3);
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        position: relative;
      }

      .agent-name {
        font-size: 1.1rem;
        font-weight: 600;
      }

      .agent-role {
        display: block;
        font-size: 0.85rem;
        color: rgba(148, 163, 184, 0.9);
        margin-top: 0.4rem;
      }

      .close-btn {
        border: none;
        background: rgba(248, 113, 113, 0.15);
        color: #f87171;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        cursor: pointer;
        font-weight: 700;
        transition: background 0.2s ease;
      }

      .close-btn:hover {
        background: rgba(248, 113, 113, 0.35);
      }

      .modal-body {
        flex: 1;
        padding: 16px 20px 22px;
        overflow-y: auto;
        line-height: 1.5;
      }

      .timestamp {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 0.82rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        color: #e0f2fe;
        padding: 4px 12px;
        margin-bottom: 0.8rem;
        border-radius: 999px;
        border: 1px solid rgba(96, 165, 250, 0.55);
        background: linear-gradient(
          135deg,
          rgba(59, 130, 246, 0.3),
          rgba(30, 58, 138, 0.38)
        );
        box-shadow: 0 0 14px rgba(59, 130, 246, 0.35);
        animation: pulseGlow 3s ease-in-out infinite;
      }

      .timestamp::before {
        content: "◎";
        font-size: 0.7rem;
        color: #bfdbfe;
        animation: spinMark 6s linear infinite;
      }

      .message {
        margin-bottom: 1rem;
        padding-bottom: 1rem;
        border-bottom: 1px dashed rgba(148, 163, 184, 0.3);
      }

      .message:last-child {
        border-bottom: none;
        margin-bottom: 0;
        padding-bottom: 0;
      }

      .thinking-indicator {
        position: relative;
        margin-top: 16px;
        padding: 10px 18px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(147, 197, 253, 0.45);
        color: #e2e8f0;
        font-size: 0.92rem;
        letter-spacing: 0.05em;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        opacity: 0;
        transform: translateY(8px);
        transition: all 0.35s ease;
        pointer-events: none;
      }

      .thinking-indicator.active {
        opacity: 1;
        transform: translateY(0);
      }

      .thinking-indicator::before {
        content: "";
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 2px solid rgba(147, 197, 253, 0.85);
        border-top-color: transparent;
        animation: spinner 1s linear infinite;
      }

      @keyframes pulseGlow {
        0%,
        100% {
          box-shadow: 0 0 12px rgba(59, 130, 246, 0.25);
          transform: translateY(0);
        }
        50% {
          box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
          transform: translateY(-1px);
        }
      }

      @keyframes spinMark {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      @keyframes spinner {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="overlay">
      <section class="board-wrapper">
        <div class="board">
          <header class="board-header">
            <div>
              <span class="board-title">协同演示 / 专家轮询</span>
              <span class="board-subtitle">拖拽此栏可移动弹窗</span>
            </div>
            <div class="board-actions">
              <span class="board-round">共 3 轮 </span>
              <button class="board-exit" aria-label="关闭弹窗">×</button>
            </div>
          </header>
          <div class="stage">
            <article class="modal" id="agent-modal-template">
              <header class="modal-header">
                <div>
                  <span class="agent-name"></span>
                  <span class="agent-role"></span>
                </div>
                <button class="close-btn" aria-label="关闭">×</button>
              </header>
              <section class="modal-body"></section>
            </article>
          </div>
          <div class="thinking-indicator" aria-live="polite"></div>
        </div>
      </section>
    </div>

    <script id="conversation-data" type="application/json">
      {
        "meta": {
          "title": "专家协同演示",
          "totalRounds": 3,
          "hostId": 99
        },
        "agents": [
          {
            "id": 1,
            "name": "Agent 1",
            "role": "数据洞察专家",
            "focus": "增长漏斗与高价值客群"
          },
          {
            "id": 2,
            "name": "Agent 2",
            "role": "交互体验专家",
            "focus": "多模态体验与数字人节奏"
          },
          {
            "id": 3,
            "name": "Agent 3",
            "role": "安全风控专家",
            "focus": "权限校验与合规"
          },
          {
            "id": 99,
            "name": "Host Agent",
            "role": "主持人 / 策略协调",
            "focus": "统筹三位专家观点"
          }
        ],
        "rounds": [
          {
            "round": 1,
            "turns": [
              { "agentId": 1, "message": "（预留：第1轮Agent1发言）" },
              { "agentId": 2, "message": "（预留：第1轮Agent2发言）" },
              { "agentId": 3, "message": "（预留：第1轮Agent3发言）" },
              { "agentId": 99, "summary": "（预留：第1轮主持总结）" }
            ]
          },
          {
            "round": 2,
            "turns": [
              { "agentId": 1, "message": "（预留：第2轮Agent1发言）" },
              { "agentId": 2, "message": "（预留：第2轮Agent2发言）" },
              { "agentId": 3, "message": "（预留：第2轮Agent3发言）" },
              { "agentId": 99, "summary": "（预留：第2轮主持总结）" }
            ]
          },
          {
            "round": 3,
            "turns": [
              { "agentId": 1, "message": "（预留：第3轮Agent1发言）" },
              { "agentId": 2, "message": "（预留：第3轮Agent2发言）" },
              { "agentId": 3, "message": "（预留：第3轮Agent3发言）" },
              { "agentId": 99, "summary": "（预留：第3轮主持总结）" }
            ]
          }
        ]
      }
    </script>

    <script>
      const stage = document.querySelector(".stage");
      const template = document.querySelector("#agent-modal-template");
      const agentModals = new Map();
      const agentLogs = new Map();
      const thinkingIndicator = document.querySelector(".thinking-indicator");
      const boardWrapper = document.querySelector(".board-wrapper");
      const boardHeader = document.querySelector(".board-header");
      const exitButton = document.querySelector(".board-exit");
      const conversationScriptEl = document.querySelector("#conversation-data");
      let scriptedData = null;
      if (conversationScriptEl) {
        try {
          scriptedData = JSON.parse(conversationScriptEl.textContent);
        } catch (error) {
          console.warn("Conversation JSON 解析失败：", error);
        }
      }

      const fallbackAgents = [
        {
          id: 1,
          name: "Agent 1",
          role: "数据洞察专家",
          focus: "增长漏斗与高价值客群",
          apiSeed: 3
        },
        {
          id: 2,
          name: "Agent 2",
          role: "交互体验专家",
          focus: "多模态体验与数字人节奏",
          apiSeed: 7
        },
        {
          id: 3,
          name: "Agent 3",
          role: "安全风控专家",
          focus: "权限校验与合规",
          apiSeed: 11
        }
      ];

      const fallbackHost = {
        id: 99,
        name: "Host Agent",
        role: "主持人 / 策略协调",
        focus: "统筹三位专家观点"
      };

      const seedPool = [3, 7, 11, 13, 17];
      const jsonHostId = scriptedData?.meta?.hostId ?? fallbackHost.id;

      function ensureSeed(agent, index) {
        if (agent.apiSeed) return agent;
        return {
          ...agent,
          apiSeed: seedPool[index % seedPool.length]
        };
      }

      const agents = (scriptedData?.agents ?? fallbackAgents)
        .filter(agent => agent.id !== jsonHostId)
        .map((agent, index) => ensureSeed(agent, index));

      const dragState = {
        active: false,
        initialized: false,
        offsetX: 0,
        offsetY: 0,
        pointerId: null
      };

      const API_ENDPOINT = "https://jsonplaceholder.typicode.com/comments";
      const ROUND_COUNT = scriptedData?.meta?.totalRounds ?? 3;
      const TURN_DELAY = 2400;
      const ROUND_PAUSE = 4500;
      const HOST_PAUSE = 5000;

      const hostAgent =
        (scriptedData?.agents ?? []).find(agent => agent.id === jsonHostId) ??
        fallbackHost;
      const scriptedRounds = scriptedData?.rounds ?? [];

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function ensureBoardVisible() {
        const rect = boardWrapper.getBoundingClientRect();
        const margin = 12;
        const width = rect.width || 420;
        const height = rect.height || 600;
        const maxX = window.innerWidth - width - margin;
        const maxY = window.innerHeight - height - margin;
        
        let nextLeft, nextTop;
        if (!dragState.initialized) {
          // 首次初始化：定位到右侧
          nextLeft = window.innerWidth - width - 48;
          nextTop = (window.innerHeight - height) / 2;
        } else {
          // 后续调整：保持当前位置但限制在视口内
          nextLeft = clamp(rect.left, margin, maxX);
          nextTop = clamp(rect.top, margin, maxY);
        }
        
        boardWrapper.style.left = `${clamp(nextLeft, margin, maxX)}px`;
        boardWrapper.style.top = `${clamp(nextTop, margin, maxY)}px`;
        boardWrapper.style.right = "auto";
        boardWrapper.style.transform = "translate(0, 0)";
        dragState.initialized = true;
      }

      function isPrimaryPointer(event) {
        if (event.pointerType === "mouse") {
          return event.button === 0;
        }
        return true;
      }

      function startDrag(event) {
        if (!isPrimaryPointer(event)) return;
        if (exitButton.contains(event.target)) {
          return;
        }
        const rect = boardWrapper.getBoundingClientRect();
        if (!dragState.initialized) {
          ensureBoardVisible();
        }
        dragState.active = true;
        dragState.offsetX = event.clientX - rect.left;
        dragState.offsetY = event.clientY - rect.top;
        dragState.pointerId = event.pointerId ?? "mouse";
        boardWrapper.classList.add("dragging");
        if (event.currentTarget.setPointerCapture && event.pointerId != null) {
          event.currentTarget.setPointerCapture(event.pointerId);
        }
      }

      function onDrag(event) {
        if (
          !dragState.active ||
          (dragState.pointerId != null && event.pointerId !== dragState.pointerId)
        ) {
          return;
        }
        event.preventDefault();
        const rect = boardWrapper.getBoundingClientRect();
        const width = rect.width;
        const height = rect.height;
        const margin = 12;
        const maxX = window.innerWidth - width - margin;
        const maxY = window.innerHeight - height - margin;
        const nextLeft = clamp(event.clientX - dragState.offsetX, margin, maxX);
        const nextTop = clamp(event.clientY - dragState.offsetY, margin, maxY);
        boardWrapper.style.left = `${nextLeft}px`;
        boardWrapper.style.top = `${nextTop}px`;
        boardWrapper.style.transform = "translate(0, 0)";
      }

      function endDrag(event) {
        if (
          !dragState.active ||
          (dragState.pointerId != null && event.pointerId !== dragState.pointerId)
        ) {
          return;
        }
        dragState.active = false;
        dragState.pointerId = null;
        boardWrapper.classList.remove("dragging");
        if (boardHeader.releasePointerCapture && event.pointerId != null) {
          boardHeader.releasePointerCapture(event.pointerId);
        }
      }

      function createModalShell(agent) {
        const modal = template.cloneNode(true);
        modal.id = "";
        modal.querySelector(".agent-name").textContent = agent.name;
        modal.querySelector(".agent-role").textContent = agent.role;
        modal.classList.add(
          agent.id === hostAgent.id ? "host-agent" : `agent-${agent.id}`
        );

        const closeBtn = modal.querySelector(".close-btn");
        closeBtn.addEventListener("click", () => {
          agentModals.delete(agent.id);
          modal.classList.remove("active");
          modal.addEventListener(
            "animationend",
            () => modal.remove(),
            { once: true }
          );
        });

        stage.appendChild(modal);
        requestAnimationFrame(() => modal.classList.add("active"));
        agentModals.set(agent.id, modal);
        return modal;
      }

      function ensureModal(agent) {
        return agentModals.get(agent.id) ?? createModalShell(agent);
      }

      function recordAgentMessage(agent, message, roundIndex) {
        if (!agentLogs.has(agent.id)) {
          agentLogs.set(agent.id, []);
        }
        agentLogs.get(agent.id).push({
          round: roundIndex + 1,
          text: message
        });
      }

      function appendMessage(
        modal,
        message,
        roundIndex,
        labelOverride,
        emphasize = false
      ) {
        const body = modal.querySelector(".modal-body");
        const messageWrap = document.createElement("div");
        messageWrap.className = "message";

        const timestamp = document.createElement("span");
        timestamp.className = "timestamp";
        const now = new Date();
        const defaultLabel = `第 ${roundIndex + 1} 轮 · ${now
          .toLocaleTimeString("zh-CN", { hour12: false })
          .slice(0, 5)}`;
        timestamp.textContent =
          labelOverride ??
          defaultLabel;

        const content = document.createElement("p");
        content.textContent = message;

        messageWrap.appendChild(timestamp);
        messageWrap.appendChild(content);
        body.appendChild(messageWrap);

        messageWrap.scrollIntoView({
          behavior: "smooth",
          block: "start",
          inline: "nearest"
        });

        focusModal(modal, emphasize);
      }

      async function fetchAgentInsight(agent, roundIndex) {
        const targetPostId = ((agent.apiSeed + roundIndex * 3) % 50) + 1;
        const url = `${API_ENDPOINT}?postId=${targetPostId}`;

        try {
          const response = await fetch(url);
          if (!response.ok) {
            throw new Error(`API ${response.status}`);
          }
          const payload = await response.json();
          const pick = payload[(agent.id + roundIndex) % payload.length];
          const cleanedBody = pick.body.replace(/\s+/g, " ").trim();
          return `围绕${agent.focus}，抓到一条来自「${pick.email}」的信号：${cleanedBody}`;
        } catch (error) {
          return `本轮暂未取到实时接口数据，先根据历史经验对${agent.focus}做预案：重点监测高风险动作并保留全链路日志。`;
        }
      }

      function focusModal(modal, emphasize = false) {
        stage.scrollTo({
          top: stage.scrollHeight,
          behavior: "smooth"
        });

        modal.scrollIntoView({
          behavior: "smooth",
          block: "center",
          inline: "nearest"
        });

        if (emphasize) {
          modal.classList.add("focus-ring");
          setTimeout(() => modal.classList.remove("focus-ring"), 2000);
        }
      }

      async function playAgentTurn(agent, roundIndex) {
        const modal = ensureModal(agent);
        const insight = await fetchAgentInsight(agent, roundIndex);
        appendMessage(modal, insight, roundIndex);
        recordAgentMessage(agent, insight, roundIndex);
      }

      function wait(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      function showThinking(text) {
        thinkingIndicator.textContent = text;
        thinkingIndicator.classList.add("active");
      }

      function hideThinking() {
        thinkingIndicator.classList.remove("active");
      }

      function composeRoundSummary(roundIndex) {
        const roundNo = roundIndex + 1;
        const segments = agents.map(agent => {
          const logs = agentLogs.get(agent.id) ?? [];
          const currentRoundEntry = [...logs]
            .reverse()
            .find(entry => entry.round === roundNo);
          if (!currentRoundEntry) {
            return `${agent.name}：本轮暂未发言`;
          }
          return `${agent.name}：${currentRoundEntry.text}`;
        });

        return (
          `主持总结（第${roundNo}轮）：\n` +
          segments.join("\n\n") +
          "\n\n建议：继续保持本轮重点，准备进入下一轮。"
        );
      }

      async function playHostTurn(roundIndex) {
        const modal = ensureModal(hostAgent);
        const summary = composeRoundSummary(roundIndex);
        const label = `主持总结 · 第 ${roundIndex + 1} 轮`;
        appendMessage(modal, summary, roundIndex, label, true);
        recordAgentMessage(hostAgent, summary, roundIndex);
      }

      async function runRounds() {
        for (let round = 0; round < ROUND_COUNT; round += 1) {
          hideThinking();
          for (const agent of agents) {
            await playAgentTurn(agent, round);
            await wait(TURN_DELAY);
          }

          showThinking(`主持人总结第 ${round + 1} 轮…`);
          await wait(HOST_PAUSE);
          hideThinking();
          await playHostTurn(round);
          await wait(TURN_DELAY);

          if (round < ROUND_COUNT - 1) {
            showThinking(`第 ${round + 2} 轮思考中…`);
            await wait(ROUND_PAUSE);
            hideThinking();
          }
        }
      }

      boardHeader.addEventListener("pointerdown", startDrag);
      window.addEventListener("pointermove", onDrag);
      window.addEventListener("pointerup", endDrag);
      window.addEventListener("resize", () => {
        if (dragState.initialized) {
          ensureBoardVisible();
        }
      });

      exitButton.addEventListener("click", () => {
        boardWrapper.style.display = "none";
        hideThinking();
      });

      window.addEventListener("load", () => {
        ensureBoardVisible();
        runRounds();
      });
    </script>
  </body>
</html>
